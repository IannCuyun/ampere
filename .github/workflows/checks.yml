name: Application checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3 ffmpeg
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: python -m pip install build
      - run: python tests/run_isolated.py
      - run: python -m pip check
      - run: python -m build
      - name: Verify wheel outside checkout
        run: |
          python -m venv /tmp/ampere-check
          /tmp/ampere-check/bin/pip install -c requirements.lock dist/*.whl
          cd /tmp
          /tmp/ampere-check/bin/python -c 'from ampere.main import QML_DIR; assert (QML_DIR / "Main.qml").is_file()'
          /tmp/ampere-check/bin/ampere-setup --help
  qml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements.lock
      - run: python tests/run_qml.py
  desktop-services:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y mpd mpc pipewire pipewire-pulse wireplumber pulseaudio-utils dbus-user-session ffmpeg libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps .
      - run: bash tests/ci_desktop_smoke.sh
